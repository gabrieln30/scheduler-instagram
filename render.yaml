# Plano GRATUITO: sem disco persistente e sem banco do Render
# (banco = Supabase ou Neon, imagens = Supabase Storage). Veja o passo a passo na conversa.
services:
  - type: web
    name: igscheduler
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT   # 1 worker so, de proposito
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GRAPH_BASE
        value: https://graph.instagram.com/v21.0
      - key: FRONTEND_URL
        value: /painel/
      # Preencha no painel do Render:
      - key: DATABASE_URL
        sync: false          # Supabase: Connect > Session pooler (porta 5432)
      - key: IG_REDIRECT_URI
        sync: false          # https://SEU-SERVICO.onrender.com/auth/instagram/callback
      - key: IG_APP_ID
        sync: false
      - key: IG_APP_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false          # python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: SUPABASE_URL
        sync: false          # https://SEU_REF.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false          # chave SECRETA do Supabase (nunca no front-end)
      - key: SUPABASE_BUCKET
        value: posts
