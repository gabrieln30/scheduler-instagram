<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agendador de Posts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121212; --surface:#1a1a1a; --surface-2:#222222; --line:#2d2d2d;
  --text:#ffffff; --muted:#a39d94;
  --accent:#ee9418; --accent-hi:#ffad3a; --accent-deep:#d07000;
  --ok:#4cc38a; --err:#ef5b5b; --radius:14px;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{
  margin:0; min-height:100vh; line-height:1.5; color:var(--text);
  font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:
    radial-gradient(900px 520px at 0% 100%, rgba(208,112,0,.16), transparent 62%),
    radial-gradient(700px 400px at 100% 0%, rgba(255,255,255,.05), transparent 60%),
    var(--bg);
}
.wrap{max-width:1120px; margin:0 auto; padding:40px 20px 80px}
.muted{color:var(--muted)} .small{font-size:.82rem}

/* hero no estilo da peca: caixa alta, leve + destaque negrito italico laranja */
.hero{display:flex; align-items:center; gap:20px; margin-bottom:40px}
.hero svg{flex:none; width:54px; height:54px}
h1{
  margin:0; font-weight:300; text-transform:uppercase; letter-spacing:.01em;
  font-size:clamp(1.6rem,4.4vw,2.9rem); line-height:1.1;
}
h1 em{font-weight:800; font-style:italic; color:var(--accent)}
h2{
  margin:0 0 18px; font-weight:300; text-transform:uppercase;
  font-size:1.25rem; letter-spacing:.03em;
}
h2 em{font-weight:800; font-style:italic; color:var(--accent)}

.grid{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:24px; align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:26px}
.stack{display:flex; flex-direction:column; gap:24px}

/* botoes */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
  border:0; border-radius:10px; padding:13px 22px; text-decoration:none;
  font:700 .82rem 'Montserrat',sans-serif; letter-spacing:.06em; text-transform:uppercase;
  background:var(--accent); color:#121212; transition:background .15s, transform .05s;
}
.btn:hover{background:var(--accent-hi)} .btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn.ghost{background:transparent; color:var(--accent); border:1.5px solid var(--accent)}
.btn.ghost:hover{background:rgba(238,148,24,.1)}
.btn-link{
  background:none; border:0; padding:4px 0; cursor:pointer; text-decoration:none;
  color:var(--muted); font:600 .78rem 'Montserrat',sans-serif; letter-spacing:.04em; text-transform:uppercase;
}
.btn-link:hover{color:var(--accent)}

/* contas */
.contas-head{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:6px}
.contas-head h2{margin:0}
.conta{display:flex; align-items:center; gap:14px; padding:14px 0; border-top:1px solid var(--line)}
.conta:first-of-type{margin-top:14px}
.avatar{
  flex:none; width:42px; height:42px; border-radius:50%; display:grid; place-items:center;
  border:2px solid var(--accent); color:var(--accent); font-weight:800;
}
.conta-info{flex:1; display:flex; flex-direction:column; min-width:0}
.conta-info strong{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

/* formulario */
label.lbl{display:block; margin:20px 0 8px; font:600 .75rem 'Montserrat',sans-serif; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
label.lbl:first-of-type{margin-top:0}
select,textarea,input[type=datetime-local]{
  width:100%; background:var(--bg); color:var(--text); border:1.5px solid var(--line); border-radius:10px;
  padding:13px 14px; font:500 .95rem 'Montserrat',sans-serif; transition:border-color .15s, box-shadow .15s;
}
select:focus,textarea:focus,input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(238,148,24,.18)}
textarea{min-height:130px; resize:vertical}
.counter{text-align:right; margin-top:6px}
.counter.over{color:var(--err)}

.drop{
  position:relative; display:grid; place-items:center; text-align:center; min-height:210px; cursor:pointer;
  border:2px dashed var(--line); border-radius:12px; padding:20px; overflow:hidden; transition:border-color .15s, background .15s;
}
.drop:hover,.drop.over{border-color:var(--accent); background:rgba(238,148,24,.05)}
.drop input{position:absolute; inset:0; opacity:0; cursor:pointer}
.drop strong{display:block; font-weight:700; margin-bottom:4px}
.drop img{max-width:100%; max-height:300px; border-radius:8px; display:block}
.hint{margin-top:8px; font-size:.8rem; color:var(--accent)}

.modo{display:flex; gap:10px}
.modo label{
  flex:1; text-align:center; cursor:pointer; padding:12px; border-radius:10px;
  border:1.5px solid var(--line); font:600 .8rem 'Montserrat',sans-serif; letter-spacing:.05em; text-transform:uppercase;
}
.modo input{display:none}
.modo input:checked + span{color:var(--accent)}
.modo label:has(input:checked){border-color:var(--accent); background:rgba(238,148,24,.08)}
#quando-box{margin-top:12px}
.submit{width:100%; margin-top:26px; padding:16px}

/* posts */
.post{display:grid; grid-template-columns:56px 1fr auto; gap:14px; align-items:center; padding:14px 0; border-top:1px solid var(--line)}
.post:first-of-type{margin-top:6px}
.post img{width:56px; height:56px; object-fit:cover; border-radius:8px; background:var(--surface-2)}
.post-info{min-width:0}
.post-info .cap{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:.9rem}
.badge{
  display:inline-block; padding:3px 10px; border-radius:999px; font:700 .68rem 'Montserrat',sans-serif;
  letter-spacing:.06em; text-transform:uppercase; border:1px solid currentColor;
}
.s-agendado{color:var(--accent)} .s-publicando{color:#6cb6ff} .s-publicado{color:var(--ok)}
.s-erro{color:var(--err)} .s-cancelado{color:var(--muted)}
.post-side{display:flex; flex-direction:column; align-items:flex-end; gap:6px}

#toasts{position:fixed; right:20px; bottom:20px; display:flex; flex-direction:column; gap:10px; z-index:10}
.toast{
  background:var(--surface-2); border:1px solid var(--line); border-left:4px solid var(--ok);
  padding:12px 16px; border-radius:10px; max-width:340px; font-size:.88rem; box-shadow:0 8px 30px rgba(0,0,0,.5);
}
.toast.err{border-left-color:var(--err)}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <svg viewBox="0 0 54 54" fill="none" aria-hidden="true">
      <circle cx="27" cy="27" r="24" stroke="#ee9418" stroke-width="3.5"/>
      <path d="M16 28l8 8 16-19" stroke="#ee9418" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>Agende seus posts <em>em todas as contas.</em></h1>
  </header>

  <div class="grid">
    <!-- NOVO POST -->
    <section class="card">
      <h2>Novo <em>post</em></h2>
      <form id="form" novalidate>
        <label class="lbl">Imagem</label>
        <div class="drop" id="drop">
          <input type="file" id="arquivo" accept="image/jpeg,image/png">
          <div id="drop-vazio">
            <strong>Arraste a imagem ou clique para escolher</strong>
            <span class="muted small">JPEG ou PNG, até 8 MB</span>
          </div>
          <img id="preview" alt="Prévia da imagem" hidden>
        </div>
        <div class="hint" id="hint" hidden></div>

        <label class="lbl" for="conta">Conta do Instagram</label>
        <select id="conta"></select>

        <label class="lbl" for="legenda">Descrição</label>
        <textarea id="legenda" maxlength="2200" placeholder="Escreva a legenda do post..."></textarea>
        <div class="counter muted small" id="counter">0 / 2200</div>

        <label class="lbl">Quando publicar</label>
        <div class="modo">
          <label><input type="radio" name="quando" value="agora" checked><span>Agora</span></label>
          <label><input type="radio" name="quando" value="agendar"><span>Agendar</span></label>
        </div>
        <div id="quando-box" hidden>
          <input type="datetime-local" id="data">
          <div class="muted small" style="margin-top:6px">Horário de Brasília</div>
        </div>

        <button class="btn submit" id="enviar" type="submit">Publicar agora</button>
      </form>
    </section>

    <div class="stack">
      <!-- CONTAS -->
      <section class="card">
        <div class="contas-head">
          <h2>Contas <em>conectadas</em></h2>
          <a class="btn ghost" href="/auth/instagram/login">+ Conectar conta</a>
        </div>
        <div id="contas"></div>
      </section>

      <!-- POSTS -->
      <section class="card">
        <h2>Seus <em>posts</em></h2>
        <div id="posts"></div>
      </section>
    </div>
  </div>
</div>
<div id="toasts"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const TZ = 'America/Sao_Paulo';
const MAX_MB = 8;

function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  el.append(...kids.filter(x => x != null && x !== false));
  return el;
}

async function api(url, opts) {
  const r = await fetch(url, opts);
  let data = null;
  try { data = await r.json(); } catch {}
  if (!r.ok) {
    const d = data && data.detail;
    throw new Error(typeof d === 'string' ? d : (d ? JSON.stringify(d) : 'Erro ' + r.status));
  }
  return data;
}

function toast(msg, tipo = 'ok') {
  const t = h('div', { class: 'toast ' + (tipo === 'err' ? 'err' : '') }, msg);
  $('#toasts').append(t);
  setTimeout(() => t.remove(), 5000);
}

const fmt = (iso, soData = false) => new Date(iso).toLocaleString('pt-BR', soData
  ? { dateStyle: 'short', timeZone: TZ }
  : { dateStyle: 'short', timeStyle: 'short', timeZone: TZ });

/* ---------- contas ---------- */
let contas = [];

async function carregarContas() {
  contas = await api('/contas');
  renderContas();
  renderSelect();
}

function renderContas() {
  const box = $('#contas');
  box.replaceChildren();
  if (!contas.length) {
    box.append(h('p', { class: 'muted' }, 'Nenhuma conta conectada ainda. Clique em "Conectar conta".'));
    return;
  }
  for (const c of contas) {
    const sub = c.ativa
      ? (c.token_expira_em ? 'Conexão válida até ' + fmt(c.token_expira_em, true) : 'Conectada')
      : 'Desconectada';
    box.append(h('div', { class: 'conta' },
      h('div', { class: 'avatar' }, (c.username[0] || '?').toUpperCase()),
      h('div', { class: 'conta-info' },
        h('strong', {}, '@' + c.username),
        h('span', { class: 'muted small' }, sub)),
      c.ativa
        ? h('button', { class: 'btn-link', type: 'button', onclick: () => desconectar(c) }, 'Desconectar')
        : h('a', { class: 'btn-link', href: '/auth/instagram/login' }, 'Reconectar')
    ));
  }
}

function renderSelect() {
  const sel = $('#conta');
  const atual = sel.value;
  sel.replaceChildren();
  const ativas = contas.filter(c => c.ativa);
  if (!ativas.length) {
    sel.append(h('option', { value: '' }, 'Conecte uma conta primeiro'));
    return;
  }
  for (const c of ativas) sel.append(h('option', { value: c.id }, '@' + c.username));
  if (atual) sel.value = atual;
}

async function desconectar(c) {
  if (!confirm('Desconectar @' + c.username + '? Os posts agendados dessa conta serão cancelados.')) return;
  try {
    await api('/contas/' + c.id, { method: 'DELETE' });
    toast('Conta desconectada.');
    await Promise.all([carregarContas(), carregarPosts()]);
  } catch (e) { toast(e.message, 'err'); }
}

/* ---------- posts ---------- */
const STATUS = { agendado: 'Agendado', publicando: 'Publicando', publicado: 'Publicado', erro: 'Erro', cancelado: 'Cancelado' };

async function carregarPosts() {
  renderPosts(await api('/posts'));
}

function renderPosts(posts) {
  const box = $('#posts');
  box.replaceChildren();
  if (!posts.length) {
    box.append(h('p', { class: 'muted' }, 'Nenhum post ainda.'));
    return;
  }
  for (const p of posts) {
    box.append(h('div', { class: 'post' },
      h('img', { src: p.imagem_url, alt: '', loading: 'lazy' }),
      h('div', { class: 'post-info' },
        h('div', { class: 'cap' }, p.legenda || '(sem descrição)'),
        h('div', { class: 'muted small' }, '@' + p.conta + ' · ' + fmt(p.agendado_para)),
        p.erro ? h('div', { class: 'small', style: 'color:var(--err)' }, p.erro) : null),
      h('div', { class: 'post-side' },
        h('span', { class: 'badge s-' + p.status }, STATUS[p.status] || p.status),
        p.status === 'agendado'
          ? h('button', { class: 'btn-link', type: 'button', onclick: () => cancelar(p.id) }, 'Cancelar')
          : null)
    ));
  }
}

async function cancelar(id) {
  if (!confirm('Cancelar este post agendado?')) return;
  try {
    await api('/posts/' + id, { method: 'DELETE' });
    toast('Post cancelado.');
    carregarPosts();
  } catch (e) { toast(e.message, 'err'); }
}

/* ---------- formulario ---------- */
let arquivo = null;
const drop = $('#drop'), input = $('#arquivo'), preview = $('#preview'), hint = $('#hint');

function escolherArquivo(f) {
  hint.hidden = true;
  if (!f) return;
  if (!['image/jpeg', 'image/png'].includes(f.type)) return toast('Use uma imagem JPEG ou PNG.', 'err');
  if (f.size > MAX_MB * 1024 * 1024) return toast('A imagem passa de ' + MAX_MB + ' MB.', 'err');
  arquivo = f;
  const url = URL.createObjectURL(f);
  preview.onload = () => {
    const r = preview.naturalWidth / preview.naturalHeight;
    if (r < 0.8 || r > 1.91) {
      hint.textContent = 'Atenção: o feed do Instagram aceita proporções entre 4:5 e 1,91:1. Esta imagem pode ser recusada.';
      hint.hidden = false;
    }
  };
  preview.src = url;
  preview.hidden = false;
  $('#drop-vazio').hidden = true;
}

input.addEventListener('change', () => escolherArquivo(input.files[0]));
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => escolherArquivo(e.dataTransfer.files[0]));

const legenda = $('#legenda'), counter = $('#counter');
legenda.addEventListener('input', () => {
  counter.textContent = legenda.value.length + ' / 2200';
  counter.classList.toggle('over', legenda.value.length >= 2200);
});

const modos = document.querySelectorAll('input[name=quando]');
const modoAtual = () => document.querySelector('input[name=quando]:checked').value;
function atualizarModo() {
  const ag = modoAtual() === 'agendar';
  $('#quando-box').hidden = !ag;
  $('#enviar').textContent = ag ? 'Agendar post' : 'Publicar agora';
  if (ag) {
    const d = new Date(Date.now() + 10 * 60000 - new Date().getTimezoneOffset() * 60000);
    $('#data').min = d.toISOString().slice(0, 16);
  }
}
modos.forEach(m => m.addEventListener('change', atualizarModo));

$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  const contaId = $('#conta').value;
  if (!arquivo) return toast('Escolha uma imagem.', 'err');
  if (!contaId) return toast('Escolha uma conta conectada.', 'err');

  const fd = new FormData();
  fd.append('conta_id', contaId);
  fd.append('legenda', legenda.value);
  fd.append('imagem', arquivo);
  const agendar = modoAtual() === 'agendar';
  if (agendar) {
    const v = $('#data').value;
    if (!v) return toast('Escolha a data e a hora.', 'err');
    if (new Date(v) <= new Date()) return toast('A data precisa ser no futuro.', 'err');
    fd.append('agendado_para', v);
  }

  const btn = $('#enviar');
  btn.disabled = true;
  try {
    await api('/posts', { method: 'POST', body: fd });
    toast(agendar ? 'Post agendado!' : 'Post na fila, sai em instantes.');
    arquivo = null; input.value = ''; preview.hidden = true; preview.removeAttribute('src');
    $('#drop-vazio').hidden = false; hint.hidden = true;
    legenda.value = ''; legenda.dispatchEvent(new Event('input'));
    await carregarPosts();
  } catch (err) {
    toast(err.message, 'err');
  } finally {
    btn.disabled = false;
  }
});

/* ---------- inicio ---------- */
(async function init() {
  const params = new URLSearchParams(location.search);
  if (params.get('conectado')) {
    toast('Conta @' + params.get('conectado') + ' conectada!');
    history.replaceState(null, '', location.pathname);
  }
  atualizarModo();
  try { await Promise.all([carregarContas(), carregarPosts()]); }
  catch (e) { toast(e.message, 'err'); }
  setInterval(() => carregarPosts().catch(() => {}), 20000);
})();
</script>
</body>
</html>
