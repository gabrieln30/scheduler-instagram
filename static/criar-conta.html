<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta</title>
  <style>
    :root { --ink:#152117; --muted:#667069; --line:#dce4dc; --green:#166534; --green-dark:#10512a; --green-pale:#eaf7ed; --surface:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:var(--ink); background:#f5f8f5; }
    .page { min-height:100vh; display:grid; grid-template-columns:minmax(360px, .94fr) 1.06fr; }
    .intro { position:relative; overflow:hidden; padding:56px clamp(32px, 7vw, 112px); display:flex; flex-direction:column; justify-content:space-between; color:white; background:linear-gradient(145deg,#105d31 0%,#178343 58%,#69b879 100%); }
    .intro:after, .intro:before { content:""; position:absolute; border:1px solid rgba(255,255,255,.22); border-radius:50%; pointer-events:none; }
    .intro:before { width:520px; height:520px; right:-190px; bottom:-190px; }
    .intro:after { width:330px; height:330px; right:-70px; bottom:-70px; }
    .brand { position:relative; z-index:1; display:flex; align-items:center; gap:10px; font-weight:750; letter-spacing:-.025em; font-size:20px; }
    .brand-mark { display:grid; place-items:center; width:32px; height:32px; border-radius:10px; background:white; color:var(--green); font-size:18px; font-weight:850; }
    .intro-copy { position:relative; z-index:1; max-width:460px; margin:80px 0; }
    .eyebrow { margin:0 0 18px; font-size:13px; font-weight:700; letter-spacing:.11em; text-transform:uppercase; opacity:.75; }
    h1 { max-width:470px; margin:0; font-size:clamp(40px,5vw,64px); line-height:1.04; letter-spacing:-.055em; }
    .intro-copy p:last-child { max-width:390px; margin:24px 0 0; font-size:17px; line-height:1.55; color:rgba(255,255,255,.84); }
    .trust { position:relative; z-index:1; display:flex; gap:12px; align-items:center; color:rgba(255,255,255,.8); font-size:13px; }
    .avatars { display:flex; }
    .avatar { width:27px; height:27px; margin-right:-7px; border:2px solid #0f0f0f; border-radius:50%; background:#d5f5d8; color:#105c30; display:grid; place-items:center; font-size:11px; font-weight:800; }
    .avatar:nth-child(2) { background:#ffe8bf; color:#8a5200; }.avatar:nth-child(3) { background:#dddefe; color:#373a88; }
    .form-side { display:flex; align-items:center; justify-content:center; padding:42px 28px; background:var(--surface); }
    .card { width:min(100%, 440px); }
    .login { margin:0 0 48px; text-align:right; font-size:14px; color:var(--muted); }
    a { color:var(--green); font-weight:700; text-decoration:none; } a:hover { text-decoration:underline; }
    h2 { margin:0; font-size:32px; letter-spacing:-.045em; line-height:1.1; }
    .subtitle { margin:11px 0 30px; color:var(--muted); font-size:15px; line-height:1.5; }
    .social { display:flex; width:100%; align-items:center; justify-content:center; gap:10px; min-height:48px; border:1px solid var(--line); border-radius:10px; color:var(--ink); background:white; font:inherit; font-size:15px; font-weight:650; cursor:pointer; }
    .social:hover { background:#f8fbf8; border-color:#bfcbbf; }.google { font-size:19px; font-weight:800; color:#4285f4; }
    .divider { display:flex; align-items:center; gap:14px; margin:24px 0; color:#8a938c; font-size:12px; }.divider:before,.divider:after { content:""; height:1px; flex:1; background:var(--line); }
    form { display:grid; gap:17px; }.name-row { display:grid; grid-template-columns:1fr 1fr; gap:15px; }
    label { display:grid; gap:7px; font-size:13px; font-weight:700; color:#354037; }
    input { width:100%; height:48px; padding:0 13px; border:1px solid var(--line); border-radius:9px; outline:none; color:var(--ink); font:inherit; background:#fff; transition:border .15s, box-shadow .15s; }
    input::placeholder { color:#a0a9a1; } input:focus { border-color:var(--green); box-shadow:0 0 0 3px #dff4e4; }
    .password-wrap { position:relative; }.password-wrap input { padding-right:52px; }.show { position:absolute; top:50%; right:5px; transform:translateY(-50%); border:0; padding:8px; background:transparent; color:var(--green); cursor:pointer; font:inherit; font-size:12px; font-weight:750; }
    .terms { display:flex; align-items:flex-start; gap:9px; margin:1px 0 4px; color:var(--muted); font-size:12px; line-height:1.45; }.terms input { width:16px; height:16px; margin:1px 0 0; accent-color:var(--green); flex:none; }
    .submit { min-height:50px; border:0; border-radius:10px; color:#fff; background:var(--green); font:inherit; font-size:15px; font-weight:750; cursor:pointer; box-shadow:0 7px 15px rgba(18,104,52,.18); transition:transform .15s, background .15s; }.submit:hover { background:var(--green-dark); transform:translateY(-1px); }.submit:disabled { opacity:.6; cursor:wait; transform:none; }
    .notice { min-height:20px; margin:0; color:var(--green); text-align:center; font-size:13px; font-weight:650; }
    @media (max-width:800px) { .page { grid-template-columns:1fr; }.intro { min-height:300px; padding:32px; }.intro-copy { margin:44px 0 8px; }.intro-copy p:last-child,.trust { display:none; } h1 { font-size:42px; }.form-side { padding:36px 24px 48px; }.login { margin-bottom:38px; } }
    @media (max-width:410px) { .name-row { grid-template-columns:1fr; } .intro { min-height:270px; } }
  </style>
</head>
<body>
  <main class="page">
    <section class="intro" aria-label="Apresentação">
      <div class="brand"><span class="brand-mark">a</span>agendador</div>
      <div class="intro-copy">
        <p class="eyebrow">Organize seu tempo</p>
        <h1>Todo grande plano começa com um horário.</h1>
        <p>Crie sua conta e tenha uma forma simples de organizar compromissos, clientes e sua rotina.</p>
      </div>
      <div class="trust"><div class="avatars"><span class="avatar">M</span><span class="avatar">A</span><span class="avatar">J</span></div><span>Junte-se a milhares de pessoas mais organizadas.</span></div>
    </section>
    <section class="form-side">
      <div class="card">
        <p class="login">Já tem uma conta? <a href="/login">Entrar</a></p>
        <h2>Crie sua conta</h2>
        <p class="subtitle">Leva menos de um minuto para começar.</p>
        <form id="signup-form" method="post" action="/criar-conta">
          <div class="name-row"><label>Nome<input required autocomplete="given-name" placeholder="Seu nome" name="nome" maxlength="80"></label><label>Sobrenome<input autocomplete="family-name" placeholder="Seu sobrenome" name="sobrenome" maxlength="80"></label></div>
          <label>E-mail<input required type="email" autocomplete="email" placeholder="voce@exemplo.com" name="email" maxlength="254"></label>
          <label>Senha<span class="password-wrap"><input required type="password" minlength="10" autocomplete="new-password" placeholder="Mínimo de 10 caracteres" id="password" name="senha"><button class="show" type="button" aria-label="Mostrar senha" id="toggle-password">Mostrar</button></span></label>
          <label class="terms"><input required type="checkbox" name="terms"><span>Ao criar uma conta, você concorda com os <a href="#termos">Termos de Uso</a> e a <a href="#privacidade">Política de Privacidade</a>.</span></label>
          <button class="submit" type="submit">Criar conta</button>
          <p class="notice" id="notice" role="status"></p>
        </form>
      </div>
    </section>
  </main>
  <script>
    const toggle = document.querySelector('#toggle-password'); const password = document.querySelector('#password');
    toggle.addEventListener('click', () => { const visible = password.type === 'text'; password.type = visible ? 'password' : 'text'; toggle.textContent = visible ? 'Mostrar' : 'Ocultar'; toggle.setAttribute('aria-label', visible ? 'Mostrar senha' : 'Ocultar senha'); });
    const erro = new URLSearchParams(location.search).get('erro');
    const mensagens = { nome: 'Informe seu nome.', email: 'Informe um e-mail válido.', senha: 'A senha precisa ter pelo menos 10 caracteres.', existe: 'Este e-mail já está cadastrado.' };
    if (mensagens[erro]) { document.querySelector('#notice').textContent = mensagens[erro]; history.replaceState(null, '', location.pathname); }
    document.querySelector('#signup-form').addEventListener('submit', event => { const button = event.currentTarget.querySelector('.submit'); button.disabled = true; button.textContent = 'Criando conta…'; });
  </script>
</body>
</html>
