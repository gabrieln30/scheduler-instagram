<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Agendador de Posts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#121212;--surface:#1a1a1a;--line:#2d2d2d;--text:#fff;--muted:#a39d94;--accent:#ee9418;--accent-hi:#ffad3a;--err:#ef5b5b}
*{box-sizing:border-box}
html{color-scheme:dark}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;color:var(--text);
  font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:
    radial-gradient(900px 520px at 0% 100%,rgba(208,112,0,.16),transparent 62%),
    radial-gradient(700px 400px at 100% 0%,rgba(255,255,255,.05),transparent 60%),var(--bg);
}
.box{width:100%;max-width:400px}
svg{width:54px;height:54px;display:block;margin-bottom:18px}
h1{margin:0 0 28px;font-weight:300;text-transform:uppercase;font-size:1.9rem;line-height:1.15}
h1 em{font-weight:800;font-style:italic;color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px}
label{display:block;margin:0 0 8px;font:600 .75rem 'Montserrat',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
input{
  width:100%;background:var(--bg);color:var(--text);border:1.5px solid var(--line);border-radius:10px;
  padding:13px 14px;margin-bottom:20px;font:500 .95rem 'Montserrat',sans-serif;
}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(238,148,24,.18)}
button{
  width:100%;border:0;border-radius:10px;padding:15px;cursor:pointer;background:var(--accent);color:#121212;
  font:700 .82rem 'Montserrat',sans-serif;letter-spacing:.06em;text-transform:uppercase;
}
button:hover{background:var(--accent-hi)}
.erro{display:none;margin-bottom:20px;padding:12px 14px;border-radius:10px;border:1px solid var(--err);color:var(--err);font-size:.88rem}
</style>
</head>
<body>
<main class="box">
  <svg viewBox="0 0 54 54" fill="none" aria-hidden="true">
    <circle cx="27" cy="27" r="24" stroke="#ee9418" stroke-width="3.5"/>
    <path d="M16 28l8 8 16-19" stroke="#ee9418" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1>Acesse o <em>painel</em></h1>
  <form class="card" method="post" action="/login">
    <div class="erro" id="erro"></div>
    <label for="usuario">Usuário</label>
    <input id="usuario" name="usuario" autocomplete="username" required autofocus>
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
  </form>
</main>
<script>
const e = new URLSearchParams(location.search).get('erro');
if (e) {
  const box = document.getElementById('erro');
  box.textContent = e === 'bloqueado'
    ? 'Muitas tentativas. Aguarde 15 minutos e tente de novo.'
    : 'Usuário ou senha incorretos.';
  box.style.display = 'block';
}
</script>
</body>
</html>
